{% extends "base.html" %}
{% block title %}Pin something &middot; The Commons{% endblock %}

{% block content %}
  {% if errors %}
  <ul>
    {% for e in errors %}<li>{{ e }}</li>{% endfor %}
  </ul>
  {% endif %}
  <form method="post">
    <label for="title">Title</label>
    <input type="text" id="title" name="title" value="{{ form.get('title', '') }}" maxlength="120" required>

    <label for="body">Body</label>
    <textarea id="body" name="body" rows="6" required>{{ form.get('body', '') }}</textarea>

    <button type="submit">Post</button>
  </form>
</div>
{% endblock %}
