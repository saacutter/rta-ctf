{% extends "base.html" %}
{% block title %}Noticeboard{% endblock %}

{% block content %}
<div>
  {% for post in posts %}
  <article>
    <span class="pin"></span>
    <h2><a href="{{ url_for('main.post_detail', post_id=post['id']) }}">{{ post['title'] }}</a></h2>
    <div>
      <span>{{ post.author_obj.username }}</span>
      &bull;
      <span>{{ post['created_at']|timeago }}</span>
    </div>
  </article>
  {% endfor %}
</div>
{% endblock %}
