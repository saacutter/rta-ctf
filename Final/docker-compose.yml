services:

  web:
    build: .
    container_name: aerospace-web

    ports:
      - "5005:5005"
      - "22:22"
      - "2121:2121"
      - "30000-30009:30000-30009"

    environment:
      - SECRET_KEY=${SECRET_KEY}

    volumes:
      - ./app/database.db:/app/database.db
      - ./app/ftp_share:/app/ftp_share

    restart: unless-stopped
